<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BMI Calculator (with units + progress bar)</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; max-width: 700px; margin: auto; }
  h1 { margin-bottom: 8px; }
  label { display:block; margin-top:12px; font-weight:600; }
  input[type="number"] { padding:8px; width: 160px; margin-right:8px; }
  select { padding:8px; }
  button { margin-top:14px; padding:8px 14px; font-size:15px; cursor:pointer; }
  .result { margin-top:18px; font-size:18px; font-weight:700; }
  .detail { margin-top:8px; font-weight:500; color:#333; }
  .error { color: #b00020; margin-top:8px; font-weight:600; }

  .bmi-bar {
    margin-top:18px;
    height:28px;
    background:#e6e7e9;
    border-radius:18px;
    overflow:hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
  }
  .bmi-fill {
    height:100%;
    width:0%;
    background: linear-gradient(90deg, #34a853, #1e88e5);
    border-radius:18px 0 0 18px;
    transition: width 600ms ease, background 400ms;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:700;
    padding:0 8px;
    box-sizing:border-box;
  }


  .under { background: linear-gradient(90deg,#2b99ff,#2b7fff); }
  .normal { background: linear-gradient(90deg,#34a853,#2f9e4a); }
  .over { background: linear-gradient(90deg,#f6b53a,#f08a24); }
  .obese { background: linear-gradient(90deg,#e24a4a,#c62828); }


  .note { margin-top:10px; color:#444; font-size:13px; }
</style>
</head>
<body>

<h1>BMI Calculator</h1>

<label for="weight">Weight (kilograms)</label>
<input id="weight" type="number" min="1" step="0.1" placeholder="e.g. 70">

<label for="height">Height</label>
<input id="height" type="number" min="0.1" step="0.01" placeholder="e.g. 1.75">
<select id="heightUnit" title="Select height unit">
  <option value="m">meters (m)</option>
  <option value="cm">centimeters (cm)</option>
  <option value="ft">feet (ft)</option>
</select>

<br>
<button id="calcBtn">Calculate BMI</button>

<div id="message" class="error" style="display:none"></div>

<div id="output" style="display:none;">
  <div class="result" id="bmiText">BMI: —</div>
  <div class="detail" id="categoryText"></div>

  <div class="bmi-bar" aria-hidden="true">
    <div id="bmiFill" class="bmi-fill">—</div>
  </div>

  <div class="note">
    Standard adult BMI ranges: Underweight &lt; 18.5, Healthy 18.5–24.9, Overweight 25.0–29.9, Obese ≥ 30.0.
  </div>
</div>

<script>

    function heightToMeters(value, unit) {
    if (isNaN(value) || value <= 0) return NaN;
    switch (unit) {
      case 'm': return value;           
      case 'cm': return value / 100;    
      case 'ft': return value * 0.3048;
      default: return NaN;
    }
  }

  function classifyBMI(bmi) {
    if (bmi < 18.5) return 'Underweight';
    if (bmi < 25.0) return 'Normal';
    if (bmi < 30.0) return 'Overweight';
    return 'Obese';
  }

  function bmiToPercent(bmi) {
    const min = 10, max = 40;
    if (isNaN(bmi)) return 0;
    if (bmi <= min) return 0;
    if (bmi >= max) return 100;
    return ((bmi - min) / (max - min)) * 100;
  }

  document.getElementById('calcBtn').addEventListener('click', function() {
    const msg = document.getElementById('message');
    msg.style.display = 'none';
    const out = document.getElementById('output');
    out.style.display = 'none';

    const w = parseFloat(document.getElementById('weight').value);
    const hVal = parseFloat(document.getElementById('height').value);
    const hUnit = document.getElementById('heightUnit').value;

    if (isNaN(w) || w <= 0) {
      msg.textContent = 'Please enter a valid weight in kilograms (e.g. 70).';
      msg.style.display = 'block';
      return;
    }
    if (isNaN(hVal) || hVal <= 0) {
      msg.textContent = 'Please enter a valid height (positive number).';
      msg.style.display = 'block';
      return;
    }

    const hMeters = heightToMeters(hVal, hUnit);
    if (isNaN(hMeters) || hMeters <= 0) {
      msg.textContent = 'Height conversion failed — check the unit.';
      msg.style.display = 'block';
      return;
    }

    if (w > 500 || w < 10) {
      if (!confirm('Entered weight looks unusual. Continue anyway?')) return;
    }
    if (hMeters > 3 || hMeters < 0.5) {
      if (!confirm('Entered height looks unusual. Continue anyway?')) return;
    }

    const bmi = w / (hMeters * hMeters);
    const bmiRounded = Math.round(bmi * 100) / 100;

    const category = classifyBMI(bmi);

    document.getElementById('bmiText').textContent = 'BMI: ' + bmiRounded.toFixed(2);
    document.getElementById('categoryText').textContent = category;

    const pct = bmiToPercent(bmi);
    const fill = document.getElementById('bmiFill');
    fill.style.width = pct + '%';
    fill.textContent = bmiRounded.toFixed(1);

    fill.classList.remove('under','normal','over','obese');
    if (category === 'Underweight') fill.classList.add('under');
    else if (category === 'Normal') fill.classList.add('normal');
    else if (category === 'Overweight') fill.classList.add('over');
    else fill.classList.add('obese');

    out.style.display = 'block';
});
</script>

</body>
</html>
